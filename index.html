<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>product-manager</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
<!-- index.html (à la racine du projet, pas dans src/) : c’est le point d’entrée de Vite. Le navigateur charge ce fichier en premier. Il contient la <div id="root"></div> et une balise <script type="module" src="/src/main.jsx"></script>. -->

<!-- La différence avec Create React App, c’est que Vite traite index.html comme le vrai point d’entrée du build, et main.jsx n’est que le script qu’il référence. Si tu renommes ou déplaces main.jsx, il faut donc mettre à jour le src dans index.html. -->
